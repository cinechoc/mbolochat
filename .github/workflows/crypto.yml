name: crypto

on:
  push:
    paths:
      - 'crypto/**'
      - 'mobile/modules/mbolo-crypto/**'
      - '.github/workflows/crypto.yml'
  pull_request:
    paths:
      - 'crypto/**'
      - 'mobile/modules/mbolo-crypto/**'
      - '.github/workflows/crypto.yml'

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crypto
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crypto
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --features jni -- -D warnings
      - name: Tests
        run: cargo test --features jni
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Licences
        run: node scripts/check-licenses.mjs
