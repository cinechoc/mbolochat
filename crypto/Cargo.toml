[package]
name = "mbolo-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
jni = ["dep:jni"]

[dependencies]
vodozemac = { version = "=0.11.1", default-features = false, features = ["precomputed-tables"] }
chacha20poly1305 = "=0.11.0"
aead-stream = { version = "=0.6.0", features = ["alloc"] }
getrandom = "=0.4.3"
sha2 = "=0.11.0"
zeroize = { version = "=1.9.0", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.23.1"
thiserror = "2"
jni = { version = "0.21", optional = true }

[[bin]]
name = "spike"
path = "src/bin/spike.rs"

[profile.release]
strip = "debuginfo"
