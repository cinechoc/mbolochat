services:
  postgres:
    image: postgres:16-alpine
    container_name: mbolochat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mbolochat
      POSTGRES_PASSWORD: mbolochat
      POSTGRES_DB: mbolochat
    ports:
      - "5432:5432"
    volumes:
      - mbolochat_pgdata:/var/lib/postgresql/data

volumes:
  mbolochat_pgdata:
